<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Next-Track</title>
</head>

<body>
    <header id="main-header">
        <div id="img-logo">
            <img src="/NULL">
            <h1>Next-Track</h1>
            <div id="user-buttons"></div>
        </div>
    </header>
    <main id="page-layout">
        <div id="left-section"> 
            <div id="playlist-tabs">
                <button type="button" class="playlist-options" id="new-button"> New Playlist </button>
                <button type="button" class="playlist-options" id="saved-button"> Saved Playlists</button>
            </div>
            
            <div id="user-playlists"></div>

            <div id="new-playlist">
                <h2>Select Genre</h2>

            </div>  
        </div>

        <div id="middle-section"> 
            <div class="playlist-header">
                <h2>playlist</h2>
            </div>
            <div id="playlist-view">
                <div class="playlist-songlist">
            <p>Song 1</p>
        </div>
    </div>
    
    <div class="save-queue-button">
        <button id="save-button"> Save Playlist </button>
        <button id="queue-button"> Add to Queue </button>
    </div>
    </div>   
        <div id="right-section"> 
            <div id="now-playing">
                <div class="now-playing-header">
                    <h2>Now Playing</h2>
                </div>
            <p id="song-title"> song title</p>
            <p id ="artist-name">artist name</p>
            </div>

            <div id= "shared-queue">
                <div class="shared-queue-header">
                    <h2>Shared Queue</h2>
                <p>song 1</p> 
                </div>
            </div>            
        </div>
    </main>
    <script src="users.js"></script>
    <script src="newPlaylist.js"></script>
    <script src="savedPlaylist.js"></script>
    <script src="savePlaylist.js"></script>
</body>
</html>
